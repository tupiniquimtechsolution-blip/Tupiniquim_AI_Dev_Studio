name: Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - mw0
          - mw1
          - mw2
          - mw3
          - mw4
          - mw5

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloud-preview
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Deploy preview control plane
        if: ${{ inputs.target == 'preview' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy Master Wave environment
        if: ${{ inputs.target != 'preview' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.jsonc --env ${{ inputs.target }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
