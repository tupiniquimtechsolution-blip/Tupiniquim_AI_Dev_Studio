name: Cloud Quality Gate

on:
  pull_request:
  push:
    branches:
      - 'cloud/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Security tests
        run: pnpm test:security
      - name: Build
        run: pnpm build
      - name: Validate Cloudflare bundle without deploy
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir .wrangler-dry-run
      - name: Upload cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-quality-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**
            .wrangler-dry-run/**
