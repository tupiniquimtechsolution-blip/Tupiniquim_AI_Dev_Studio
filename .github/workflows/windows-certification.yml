name: Windows Release Certification

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-certification:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Security tests
        run: pnpm test:security
      - name: Build
        run: pnpm build
      - name: Windows script fixtures
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/scripts/ollama-live-smoke.test.ps1
      - name: Electron E2E on hosted Windows
        run: pnpm test:e2e
      - name: Package Windows
        run: pnpm package:win
      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-certification-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            release/**
            test-results/**
            playwright-report/**

# Hosted Windows evidence is supplemental. It does not replace the final physical
# F:\ certification for ConPTY/Ollama/local hardware/OAuth flows when those gates apply.
