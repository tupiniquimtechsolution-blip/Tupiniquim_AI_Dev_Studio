name: Web Product Smoke

on:
  push:
    branches:
      - integration/ai-lab-toolbox-unified
  workflow_dispatch:
    inputs:
      base_url:
        description: URL pública implantada do Tupiniquim Dev AI Web. Se vazia, usa vars.WEB_SMOKE_BASE_URL.
        required: false
        type: string
      production_ready:
        description: Exigir Access + persistência durável READY
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Cloud Quality Gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: web-product-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    name: smoke-target
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'integration/ai-lab-toolbox-unified'
      )
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.target.outputs.base_url }}
    env:
      REQUESTED_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || vars.WEB_SMOKE_BASE_URL }}
    steps:
      - id: target
        name: Resolve public deployment URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_BASE_URL}" ]; then
            echo "::error::LIVE_WEB_SMOKE_BLOCKED: configure a URL pública real em vars.WEB_SMOKE_BASE_URL ou informe base_url manualmente."
            exit 1
          fi
          node -e "const u=new URL(process.env.REQUESTED_BASE_URL); if (u.protocol !== 'https:') { console.error('WEB_SMOKE_BASE_URL deve usar HTTPS.'); process.exit(1) }"
          normalized="${REQUESTED_BASE_URL%/}"
          echo "base_url=${normalized}" >> "${GITHUB_OUTPUT}"
          echo "Smoke target configurado: ${normalized}"

  smoke:
    name: live-web-smoke
    needs:
      - target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_SMOKE_BASE_URL: ${{ needs.target.outputs.base_url }}
      WEB_SMOKE_REQUIRE_PRODUCTION_READY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.production_ready == 'true' }}
      WEB_SMOKE_ACCESS_CLIENT_ID: ${{ secrets.WEB_SMOKE_ACCESS_CLIENT_ID }}
      WEB_SMOKE_ACCESS_CLIENT_SECRET: ${{ secrets.WEB_SMOKE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate smoke authentication configuration
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "${WEB_SMOKE_ACCESS_CLIENT_ID}" ] && [ -z "${WEB_SMOKE_ACCESS_CLIENT_SECRET}" ]; } || { [ -z "${WEB_SMOKE_ACCESS_CLIENT_ID}" ] && [ -n "${WEB_SMOKE_ACCESS_CLIENT_SECRET}" ]; }; then
            echo "WEB_SMOKE_ACCESS_CLIENT_ID e WEB_SMOKE_ACCESS_CLIENT_SECRET devem existir juntos."
            exit 1
          fi
      - name: Wait for deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="${WEB_SMOKE_BASE_URL%/}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --location --output /tmp/tupiniquim-health.json --write-out '%{http_code}' --max-time 10 "${base}/api/health" || true)"
            if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
              node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/tupiniquim-health.json','utf8')); if (body.ok !== true || body.product !== 'Tupiniquim Dev AI Web') process.exit(1)"
              echo "Deployment respondeu ao health na tentativa ${attempt}."
              exit 0
            fi
            echo "Health ainda indisponível (HTTP ${code:-000}), tentativa ${attempt}/30."
            sleep 10
          done
          echo "Deployment não ficou saudável dentro da janela de espera."
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Web Product Smoke
        run: pnpm test:web-smoke
      - name: Upload Web Product Smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-product-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          if-no-files-found: ignore
          path: |
            test-results/web-product-smoke/**
            playwright-report-web/**
